name: Auto Indexar Biblioteca

on:
  push:
    paths:
      - '*.pdf' # Se activa solo cuando subes un archivo PDF

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para que el bot modifique index.json y haga push

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install groq pypdf

    - name: Ejecutar Indexador Inteligente
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python procesar.py

    - name: Guardar cambios en GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add index.json procesados.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-index: Nueva bibliografía añadida" && git push)
