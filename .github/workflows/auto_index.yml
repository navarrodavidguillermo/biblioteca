name: Auto Indexar Biblioteca

on:
  push:
    branches:
      - main # Se ejecuta con cualquier cambio en la rama principal (incluyendo actualizar scripts o subir PDFs)
  workflow_dispatch: # Esto añade un botón en GitHub para ejecutarlo manualmente cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso para que el bot guarde index.json

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install groq pypdf

    - name: Ejecutar Indexador Inteligente
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python procesar.py

    - name: Guardar cambios en GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Intentamos añadir index.json (siempre se genera o modifica)
        git add index.json
        
        # Añadimos procesados.txt solo si existe
        if [ -f "procesados.txt" ]; then
          git add procesados.txt
        fi
        
        # Subimos los cambios solo si hay diferencias reales en el repositorio
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-index: Base de datos actualizada" && git push)
