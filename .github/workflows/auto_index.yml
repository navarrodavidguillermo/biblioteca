name: Auto Indexar Biblioteca

on:
  push:
    paths:
      - '*.pdf' # Se activa automáticamente solo cuando subes un archivo PDF

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso crucial para que el bot pueda guardar los cambios en tu index.json

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        pip install groq pypdf

    - name: Ejecutar Indexador Inteligente
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python procesar.py

    - name: Guardar cambios en GitHub
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        
        # Añadimos index.json (siempre existe)
        git add index.json
        
        # Verificación condicional para evitar el error 'did not match any files'
        if [ -f "procesados.txt" ]; then
          git add procesados.txt
        fi
        
        # Guardar y subir cambios solo si index.json o procesados.txt cambiaron
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-index: Nueva bibliografía añadida" && git push)
