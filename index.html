<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Inteligente - Biblioteca Médica</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto p-4 md:p-6">
        <header class="mb-8 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">🔍 Buscador Clínico Estricto</h1>
                <p class="text-sm text-slate-400 mt-1">Biblioteca Personal de Protocolos Pediátricos</p>
            </div>
            <button onclick="borrarApiKey()" class="text-xs bg-red-950 hover:bg-red-900 text-red-300 px-3 py-1.5 rounded-lg border border-red-800/40 transition-colors cursor-pointer">
                Remover API Key
            </button>
        </header>

        <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 mb-6">
            <label for="consulta-clinica" class="block text-sm font-semibold text-slate-300 mb-2">
                Ingresá la Enfermedad Actual, síntomas cardinales o parámetros de laboratorio del paciente:
            </label>
            <textarea id="consulta-clinica" rows="4" 
                class="w-full bg-slate-950 border border-slate-600 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-sky-500 placeholder-slate-500 text-sm"
                placeholder="Ej: Lactante con fiebre alta, irritabilidad extrema y fontanela abombada..."></textarea>
            
            <div class="flex flex-wrap items-center justify-between gap-4 mt-4">
                <span id="status-motor" class="text-xs font-medium text-slate-400">Listo para buscar</span>
                <button id="btn-buscar" onclick="consultarBibliotecaIA()"
                    class="bg-sky-600 hover:bg-sky-500 text-white font-semibold text-sm px-5 py-2.5 rounded-lg transition-colors cursor-pointer shadow-md">
                    Consultar Caso
                </button>
            </div>
        </div>

        <div id="resultado-container" class="hidden bg-slate-800 rounded-xl shadow-lg border border-slate-700 overflow-hidden">
            <div class="bg-slate-750 px-4 py-3 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-sm font-bold text-sky-400 uppercase tracking-wider">📋 Evidencia Clínica Extraída</h2>
                <button onclick="limpiarPantalla()" class="text-xs text-slate-400 hover:text-slate-200 cursor-pointer">Limpiar</button>
            </div>
            <div id="texto-analisis-ia" class="p-5 text-sm leading-relaxed text-slate-200 space-y-4">
                </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        // Detecta automáticamente el dominio de tu GitHub Pages actual
        const BASE_BIBLIOTECA = window.location.origin + window.location.pathname;

        // MANEJO SEGURO DE LA API KEY (Almacenada localmente en tu navegador)
        function obtenerApiKey() {
            let key = localStorage.getItem('groq_api_key');
            if (!key) {
                key = prompt("🔑 Por seguridad, ingresá tu Groq API Key para activar el buscador clínico:\n(Se guardará de forma local en este navegador y no se subirá a GitHub)");
                if (key) {
                    localStorage.setItem('groq_api_key', key.trim());
                }
            }
            return key;
        }

        function borrarApiKey() {
            localStorage.removeItem('groq_api_key');
            alert("Clave eliminada del navegador.");
            location.reload();
        }

        // SYSTEM PROMPT ULTRA-ESTRICTO: Forzado clínico basado solo en la evidencia provista
        const SYSTEM_PROMPT_CONSULTA = `# ROL Y PERFIL PROFESIONAL
Actúas como un Asistente de Investigación Clínica Pediátrica de Alta Precisión. Tu comunicación es estrictamente médica, académica y directa.

# INSTRUCCIONES DE FLUJO ABSOLUTAS
- Se te proporcionará obligatoriamente el texto extraído selectivamente de los archivos PDF de la biblioteca personal del usuario bajo la etiqueta [TEXTO EXTRAÍDO DE LOS PDFS DE LA BIBLIOTECA PERSONAL].
- Tu única tarea es responder desglosando de forma exhaustiva, minuciosa y detallada la información contenida en esos documentos adjuntos.
- Explota al máximo los datos de laboratorios, parámetros, imágenes, criterios de internación, dosis y algoritmos provistos en el texto adjunto.
- RESTRICCIÓN CRÍTICA: Está terminantemente prohibido inventar, deducir pautas, o utilizar conocimientos médicos externos que no estén explitamente escritos en los bloques de texto provistos. Si el documento no menciona un dato, no lo agregues bajo ninguna circunstancia.
- Estructura tu respuesta de forma directa, sin títulos generales de apertura ni saludos. Entrega rigurosamente los siguientes puntos estructurados en texto plano/viñetas para cada patología analizada:
  * Análisis clínico detallado y criterios evolutivos según el o los documentos correspondientes.
  * Estudios complementarios indicados de forma específica (laboratorios, imágenes, cultivos, etc.) detallados en el o los documentos.
  * Esquema terapéutico, dosis exactas, vías de administración y conductas dictadas en el o los documentos.
  * Al final de la respuesta, añade una línea en blanco por cada documento utilizado y coloca exactamente la URL provista en el campo "URL Original X:" para que el usuario pueda descargarlos de forma directa.`;

        // Extractor inteligente por relevancia clínica
        async function extraerTextoPDF(url) {
            try {
                const checkRes = await fetch(url, { method: 'HEAD' });
                if (!checkRes.ok) return null;

                const documentoPdf = await pdfjsLib.getDocument(url).promise;
                let textoCompleto = "";
                let paginasAgregadas = 0;
                
                const palabrasFiltro = ["estudio", "laboratorio", "complementario", "tratamiento", "dosis", "conducta", "esquema", "punción", "lcr", "hemocultivo", "cultivo", "diagnóstico", "criterio", "mg/kg", "goteo", "vía", "antbiotico", "radiografia", "eco"];
                const maxPaginasEscanear = Math.min(documentoPdf.numPages, 15);
                
                for (let i = 1; i <= maxPaginasEscanear; i++) {
                    if (paginasAgregadas >= 4) break;
                    try {
                        const pagina = await documentoPdf.getPage(i);
                        const contenidoTexto = await pagina.getTextContent();
                        const textoPagina = contenidoTexto.items.map(item => item.str).join(" ");
                        const textoMinuscula = textoPagina.toLowerCase();

                        if (i === 1 || palabrasFiltro.some(palabra => textoMinuscula.includes(palabra))) {
                            textoCompleto += `[Pág ${i}]: ${textoPagina}\n`;
                            paginasAgregadas++;
                        }
                    } catch (e) {}
                }
                return textoCompleto;
            } catch (error) {
                return null;
            }
        }

        function formatearMarkdownAHtml(texto) {
            let html = texto.replace(/\n/g, "<br>");
            html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
            html = html.replace(/\*(.*?)\*/g, "<em>$1</em>");
            const urlRegex = /(https?:\/\/[^\s<]+)/g;
            return html.replace(urlRegex, function(url) {
                let urlLimpia = url.replace(/[\)\]\.\,]+$/, "");
                return `<a href="${urlLimpia}" target="_blank" class="text-sky-400 font-semibold underline hover:text-sky-300">${urlLimpia}</a>`;
            });
        }

        async function llamarGroq(textoUsuario) {
            const apiKey = obtenerApiKey();
            if (!apiKey) throw new Error("API Key no provista.");

            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: SYSTEM_PROMPT_CONSULTA },
                        { role: "user", content: textoUsuario }
                    ],
                    temperature: 0.0 // Cero determinismo para evitar alucinaciones médicas
                })
            });
            if (!res.ok) {
                if(res.status === 401) {
                    borrarApiKey();
                    throw new Error("API Key inválida.");
                }
                throw new Error(`HTTP error! status: ${res.status}`);
            }
            const data = await res.json();
            return data.choices[0].message.content.trim();
        }

        // MOTOR DE BÚSQUEDA MULTI-TOKEN INDEPENDIENTE
        async function consultarBibliotecaIA() {
            const input = document.getElementById('consulta-clinica');
            const status = document.getElementById('status-motor');
            const container = document.getElementById('resultado-container');
            const btn = document.getElementById('btn-buscar');
            const textoHtml = document.getElementById('texto-analisis-ia');
            const texto = input.value.trim();

            if (!texto) return alert("Por favor, describa los signos o parámetros del caso.");
            if (!obtenerApiKey()) return;

            btn.disabled = true;
            status.innerText = "⏳ Analizando términos clínicos...";
            container.classList.add('hidden');

            try {
                let bloqueContexto = `[TEXTO EXTRAÍDO DE LOS PDFS DE LA BIBLIOTECA PERSONAL]\n`;
                let conteoPdfs = 0;

                const respuestaJson = await fetch(`${BASE_BIBLIOTECA}index.json`);
                if (!respuestaJson.ok) throw new Error("Error cargando index.json");

                const listaPdfs = await respuestaJson.json();

                // Normalización lingüística rigurosa
                const limpiarTexto = (t) => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
                
                const consultaLimpia = limpiarTexto(texto);
                const tokensMedico = consultaLimpia.split(/\s+/).filter(word => word.length > 3);

                const pdfsCoincidentes = listaPdfs.filter(pdf => {
                    if (!pdf || !pdf.archivo) return false;

                    // 1. Control estricto de Exclusiones
                    if (pdf.excluir && pdf.excluir.some(ex => consultaLimpia.includes(limpiarTexto(ex)))) {
                        return false;
                    }

                    // 2. Control de match directo en el Título del Protocolo
                    const nombreLimpio = limpiarTexto(pdf.nombre);
                    const matchPorNombre = tokensMedico.some(token => nombreLimpio.includes(token));
                    if (matchPorNombre) return true;

                    // 3. Control cruzado por coincidencia de tokens en el array de palabras clave
                    if (pdf.palabras_clave && Array.isArray(pdf.palabras_clave)) {
                        return pdf.palabras_clave.some(keyword => {
                            const kwLimpia = limpiarTexto(keyword);
                            return consultaLimpia.includes(kwLimpia);
                        });
                    }

                    return false;
                });

                // BLOQUE DE FRENO INMEDIATO: Si no coincide con las palabras clave locales, no gasta tokens ni consulta a Groq
                if (pdfsCoincidentes.length === 0) {
                    status.innerText = "❌ Búsqueda finalizada";
                    textoHtml.innerHTML = `<div class="bg-amber-950/40 border border-amber-500/30 rounded-lg p-4 text-amber-300 font-medium flex items-center gap-2">
                        <span>⚠️</span> Información no encontrada en la biblioteca digital local para los criterios ingresados.
                    </div>`;
                    container.classList.remove('hidden');
                    return;
                }
                
                // Procesar los PDFs validados como verdaderos positivos
                for (let index = 0; index < pdfsCoincidentes.length; index++) {
                    const pdf = pdfsCoincidentes[index];
                    const urlPdf = `${BASE_BIBLIOTECA}${pdf.archivo}`;
                    status.innerText = `⏳ Mapeando páginas de: ${pdf.nombre}...`;
                    
                    const textoExtraido = await extraerTextoPDF(urlPdf);
                    if (textoExtraido && textoExtraido.trim().length > 0) {
                        bloqueContexto += `=== INICIO DOCUMENTO: ${pdf.nombre} ===\nURL Original ${index + 1}: ${urlPdf}\n${textoExtraido}=== FIN DOCUMENTO ===\n\n`;
                        conteoPdfs++;
                    }
                }

                if (conteoPdfs === 0) {
                    status.innerText = "❌ Error de lectura";
                    textoHtml.innerHTML = `<div class="bg-red-950/40 border border-red-500/30 rounded-lg p-4 text-red-300 font-medium">
                        ⚠️ No se pudo extraer el texto de los documentos seleccionados. Verifique que existan en el repositorio.
                    </div>`;
                    container.classList.remove('hidden');
                    return;
                }

                bloqueContexto += `--------------------------------------------------\n[CONSULTA DEL CASO CLÍNICO ACTUAL]:\n${texto}`;
                if (bloqueContexto.length > 38000) bloqueContexto = bloqueContexto.substring(0, 38000) + "\n... [Truncado] ...";

                status.innerText = `🧠 Analizando rigurosamente con tu protocolo: ${pdfsCoincidentes[0].nombre}...`;
                
                const respuestaIA = await llamarGroq(bloqueContexto);
                textoHtml.innerHTML = formatearMarkdownAHtml(respuestaIA);
                container.classList.remove('hidden');
                status.innerText = "✅ Análisis Finalizado";

            } catch (err) {
                status.innerText = "❌ Error general";
                console.error(err);
            } finally {
                btn.disabled = false;
            }
        }

        function limpiarPantalla() {
            document.getElementById('consulta-clinica').value = "";
            document.getElementById('resultado-container').classList.add('hidden');
            document.getElementById('status-motor').innerText = "Listo para buscar";
        }
    </script>
</body>
</html>
