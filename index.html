<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Inteligente - Biblioteca Médica</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto p-4 md:p-6">
        <header class="mb-8 border-b border-slate-700 pb-4 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-sky-400">🔍 Buscador Clínico Estricto (Anti-Errores)</h1>
                <p class="text-sm text-slate-400 mt-1">Biblioteca Personal de Protocolos Pediátricos</p>
            </div>
            <button onclick="borrarApiKey()" class="text-xs bg-red-950 hover:bg-red-900 text-red-300 px-3 py-1.5 rounded-lg border border-red-800/40 transition-colors cursor-pointer">
                Remover API Keys
            </button>
        </header>

        <div class="bg-slate-800 p-4 rounded-xl shadow-lg border border-slate-700 mb-6">
            <label for="consulta-clinica" class="block text-sm font-semibold text-slate-300 mb-2">
                Ingresá la Enfermedad Actual, síntomas cardinales o parámetros de laboratorio del paciente:
            </label>
            <textarea id="consulta-clinica" rows="4" 
                class="w-full bg-slate-950 border border-slate-600 rounded-lg p-3 text-slate-200 focus:outline-none focus:border-sky-500 placeholder-slate-500 text-sm"
                placeholder="Ej: Lactante con fiebre alta, irritabilidad extrema y fontanela abombada..."></textarea>
            
            <div class="flex flex-wrap items-center justify-between gap-4 mt-4">
                <span id="status-motor" class="text-xs font-medium text-slate-400">Listo para buscar</span>
                <button id="btn-buscar" onclick="consultarBibliotecaIA()"
                    class="bg-sky-600 hover:bg-sky-500 text-white font-semibold text-sm px-5 py-2.5 rounded-lg transition-colors cursor-pointer shadow-md">
                    Consultar Caso
                </button>
            </div>
        </div>

        <div id="resultado-container" class="hidden bg-slate-800 rounded-xl shadow-lg border border-slate-700 overflow-hidden">
            <div class="bg-slate-750 px-4 py-3 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-sm font-bold text-sky-400 uppercase tracking-wider">📋 Evidencia Clínica Extraída</h2>
                <button onclick="limpiarPantalla()" class="text-xs text-slate-400 hover:text-slate-200 cursor-pointer">Limpiar</button>
            </div>
            <div id="texto-analisis-ia" class="p-5 text-sm leading-relaxed text-slate-200 space-y-4">
                </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        const BASE_BIBLIOTECA = window.location.origin + window.location.pathname;

        // MANEJO MULTI-KEY
        function obtenerApiKey() {
            let keys = localStorage.getItem('groq_api_keys');
            if (!keys) {
                let input = prompt("🔑 Por seguridad, ingresá tus Groq API Keys.\n\nPodés poner varias separadas por comas para activar la rotación de respaldo (Ejemplo: gsk_123..., gsk_456...):");
                if (input) {
                    localStorage.setItem('groq_api_keys', input.trim());
                    keys = input.trim();
                }
            }
            return keys ? keys.split(',').map(k => k.trim()) : null;
        }

        function borrarApiKey() {
            localStorage.removeItem('groq_api_keys');
            alert("Claves eliminadas del navegador.");
            location.reload();
        }

        const SYSTEM_PROMPT_CONSULTA = `# ROL Y PERFIL PROFESIONAL
Actúas como un Asistente de Investigación Clínica Pediátrica de Alta Precisión. Tu comunicación es estrictamente médica, académica, directa y fragmentada por protocolo.

# INSTRUCCIONES DE FLUJO ABSOLUTAS
- Se te proporcionará el texto extraído de uno o varios archivos PDF bajo la etiqueta [TEXTO EXTRAÍDO DE LOS PDFS DE LA BIBLIOTECA PERSONAL].
- Si recibes información de múltiples documentos, debes procesar y desglosar la información de cada uno de ellos POR SEPARADO, utilizando títulos claros con el nombre de cada protocolo.
- RESTRICCIÓN CRÍTICA: Está terminantemente prohibido inventar, deducir pautas o mezclar tratamientos entre diferentes documentos. Si un documento no menciona un dato, no lo agregues. No utilices conocimientos médicos externos.
- Estructura tu respuesta de forma directa, sin saludos ni introducciones generales. Por cada documento analizado, entrega rigurosamente el siguiente esquema:

## [NOMBRE DEL PROTOCOLO ANALIZADO]
* **Análisis clínico detallado y criterios evolutivos:** (Según la información de este documento específico)
* **Estudios complementarios indicados:** (Laboratorios, imágenes, cultivos, etc. detallados en este documento)
* **Esquema terapéutico y dosis:** (Dosis exactas, vías de administración y conductas dictadas en este documento)

- Al final de toda la respuesta, añade una sección llamada "📚 DOCUMENTOS ASOCIADOS Y DESCARGAS" y coloca en orden las URL provistas en el campo "URL Original X:" para que el usuario pueda descargarlos directamente.`;

        // Extractor quirúrgico estricto con limpieza de caracteres ocultos (Previene Error 400)
        async function extraerTextoPDF(url, tokensMedico) {
            try {
                const checkRes = await fetch(url, { method: 'HEAD' });
                if (!checkRes.ok) return null;

                const documentoPdf = await pdfjsLib.getDocument(url).promise;
                let textoFiltrado = "";
                const maxPaginas = Math.min(documentoPdf.numPages, 10);
                
                const palabrasControl = (tokensMedico && tokensMedico.length > 0) ? tokensMedico : ["tratamiento", "dosis", "criterio", "esquema"];

                for (let i = 1; i <= maxPaginas; i++) {
                    try {
                        const pagina = await documentoPdf.getPage(i);
                        const contenidoTexto = await pagina.getTextContent();
                        let textoPagina = contenidoTexto.items.map(item => item.str).join(" ");
                        
                        // Limpieza de caracteres bizarros de control ASCII que rompen los JSON
                        textoPagina = textoPagina.replace(/[\x00-\x1F\x7F-\x9F]/g, " ");

                        const lineas = textoPagina.split(/[.:;]\s+/);
                        lineas.forEach(linea => {
                            const lineaMinuscula = linea.toLowerCase();
                            if (palabrasControl.some(token => lineaMinuscula.includes(token))) {
                                if (linea.trim().length > 12 && !textoFiltrado.includes(linea.substring(0, 25))) {
                                    textoFiltrado += `[Pág ${i}]: ${linea.trim()}.\n`;
                                }
                            }
                        });
                    } catch (e) {}
                }
                
                // Backup ultra-corto seguro libre de roturas
                if (textoFiltrado.trim().length < 50) {
                    const primeraPagina = await documentoPdf.getPage(1);
                    const contenidoBkp = await primeraPagina.getTextContent();
                    let txtBkp = contenidoBkp.items.map(item => item.str).join(" ").replace(/[\x00-\x1F\x7F-\x9F]/g, " ");
                    textoFiltrado = `[Pág 1 Fragmento]: ` + txtBkp.substring(0, 400) + "...\n";
                }
                
                return textoFiltrado;
            } catch (error) {
                return null;
            }
        }

        function formatearMarkdownAHtml(texto) {
            let html = texto.replace(/\n/g, "<br>");
            html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
            html = html.replace(/\*(.*?)\*/g, "<em>$1</em>");
            html = html.replace(/## (.*?)(<br>|$)/g, '<h3 class="text-base font-bold text-sky-400 mt-4 mb-2 border-b border-slate-700 pb-1">$1</h3>');
            const urlRegex = /(https?:\/\/[^\s<]+)/g;
            return html.replace(urlRegex, function(url) {
                let urlLimpia = url.replace(/[\)\]\.\,]+$/, "");
                return `<a href="${urlLimpia}" target="_blank" class="text-sky-400 font-semibold underline hover:text-sky-300">${urlLimpia}</a>`;
            });
        }

        // LLAMADA REVISADA Y ESCAPADA (Previene HTTP 400 y 429)
        async function llamarGroq(textoUsuario) {
            let listaKeys = obtenerApiKey();
            if (!listaKeys || listaKeys.length === 0) throw new Error("No hay API Keys cargadas.");

            for (let i = 0; i < listaKeys.length; i++) {
                let claveActual = listaKeys[i];
                try {
                    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${claveActual}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "llama3-8b-8192", 
                            messages: [
                                { role: "system", content: SYSTEM_PROMPT_CONSULTA },
                                { role: "user", content: textoUsuario }
                            ],
                            temperature: 0 // Cambiado a entero absoluto para evitar rechazos de tipo en el parser
                        })
                    });

                    if (res.status === 429) {
                        console.warn(`⚠️ Clave ${i + 1} agotada (429). Rotando llave...`);
                        if (i < listaKeys.length - 1) {
                            continue; 
                        } else {
                            throw new Error("429");
                        }
                    }

                    if (!res.ok) {
                        if (res.status === 401 && listaKeys.length === 1) {
                            borrarApiKey();
                            throw new Error("API Key inválida.");
                        }
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    
                    const data = await res.json();
                    return data.choices[0].message.content.trim();

                } catch (err) {
                    if (i === listaKeys.length - 1) throw err;
                }
            }
            throw new Error("Todas las API Keys cargadas están saturadas actualmente.");
        }

        async function consultarBibliotecaIA() {
            const input = document.getElementById('consulta-clinica');
            const status = document.getElementById('status-motor');
            const container = document.getElementById('resultado-container');
            const btn = document.getElementById('btn-buscar');
            const textoHtml = document.getElementById('texto-analisis-ia');
            const texto = input.value.trim();

            if (!texto) return alert("Por favor, describa los signos o parámetros del caso.");
            if (!obtenerApiKey()) return;

            btn.disabled = true;
            status.innerText = "⏳ Analizando términos clínicos...";
            container.classList.add('hidden');

            try {
                let bloqueContexto = `[TEXTO EXTRAÍDO DE LOS PDFS DE LA BIBLIOTECA PERSONAL]\n`;
                let conteoPdfs = 0;

                const respuestaJson = await fetch(`${BASE_BIBLIOTECA}index.json`);
                if (!respuestaJson.ok) throw new Error("Error cargando index.json");

                const listaPdfs = await respuestaJson.json();

                const limpiarTexto = (t) => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"");
                
                const consultaLimpia = limpiarTexto(texto);
                const tokensMedico = consultaLimpia.split(/\s+/).filter(word => word.length > 3);

                let pdfsCoincidentes = listaPdfs.filter(pdf => {
                    if (!pdf || !pdf.archivo) return false;

                    if (pdf.excluir && pdf.excluir.some(ex => consultaLimpia.includes(limpiarTexto(ex)))) {
                        return false;
                    }

                    const nombreLimpio = limpiarTexto(pdf.nombre);
                    const matchPorNombre = tokensMedico.some(token => nombreLimpio.includes(token));
                    if (matchPorNombre) return true;

                    if (pdf.palabras_clave && Array.isArray(pdf.palabras_clave)) {
                        return pdf.palabras_clave.some(keyword => consultaLimpia.includes(limpiarTexto(keyword)));
                    }

                    return false;
                });

                pdfsCoincidentes.sort((a, b) => a.nombre.localeCompare(b.nombre));

                if (pdfsCoincidentes.length === 0) {
                    status.innerText = "❌ Búsqueda finalizada";
                    textoHtml.innerHTML = `<div class="bg-amber-950/40 border border-amber-500/30 rounded-lg p-4 text-amber-300 font-medium flex items-center gap-2">
                        <span>⚠️</span> Información no encontrada en la biblioteca digital local para los criterios ingresados.
                    </div>`;
                    container.classList.remove('hidden');
                    btn.disabled = false;
                    return;
                }
                
                let encabezadoAviso = `<div class="bg-sky-950/50 border border-sky-500/30 text-sky-300 rounded-lg p-3 text-xs mb-4 font-medium flex items-center gap-2">
                    <span>ℹ️</span> Se encontraron <strong>${pdfsCoincidentes.length} documentos</strong> que coinciden con tu búsqueda en la biblioteca personal.
                </div>`;

                for (let index = 0; index < pdfsCoincidentes.length; index++) {
                    const pdf = pdfsCoincidentes[index];
                    const urlPdf = `${BASE_BIBLIOTECA}${pdf.archivo}`;
                    status.innerText = `⏳ Mapeando documento (${index + 1}/${pdfsCoincidentes.length}): ${pdf.nombre}...`;
                    
                    const textoExtraido = await extraerTextoPDF(urlPdf, tokensMedico);
                    if (textoExtraido && textoExtraido.trim().length > 0) {
                        bloqueContexto += `=== INICIO DOCUMENTO: ${pdf.nombre} ===\nURL Original ${index + 1}: ${urlPdf}\n${textoExtraido}=== FIN DOCUMENTO ===\n\n`;
                        conteoPdfs++;
                    }
                }

                if (conteoPdfs === 0) {
                    status.innerText = "❌ Error de lectura";
                    textoHtml.innerHTML = `<div class="bg-red-950/40 border border-red-500/30 rounded-lg p-4 text-red-300 font-medium">
                        ⚠️ No se pudo procesar la lectura física de los documentos seleccionados.
                    </div>`;
                    container.classList.remove('hidden');
                    btn.disabled = false;
                    return;
                }

                // Asegurar que el contenido agregado al final esté bien formateado y libre de saltos crudos sin escapar
                const textoCasoSanitizado = texto.replace(/[\x00-\x1F\x7F-\x9F]/g, " ");
                bloqueContexto += `--------------------------------------------------\n[CONSULTA DEL CASO CLÍNICO ACTUAL]:\n${textoCasoSanitizado}`;
                
                // Truncado seguro
                if (bloqueContexto.length > 18000) {
                    bloqueContexto = bloqueContexto.substring(0, 18000) + "\n... [Truncado seguro] ...";
                }

                status.innerText = `🧠 Analizando de forma aislada ${conteoPdfs} guías...`;
                
                const respuestaIA = await llamarGroq(bloqueContexto);
                
                textoHtml.innerHTML = encabezadoAviso + formatearMarkdownAHtml(respuestaIA);
                container.classList.remove('hidden');
                status.innerText = "✅ Análisis Finalizado";

            } catch (err) {
                status.innerText = "❌ Error general";
                console.error(err);
                
                let msgError = err.message === "429" 
                    ? `⚠️ Límite de velocidad estricto de Groq alcanzado temporalmente.<br><br>💡 <strong>Solución:</strong> Esperá 30 segundos a que la plataforma reinicie tu cuota por minuto, o carga otra clave adicional de respaldo.`
                    : `<strong>Error de ejecución (HTTP ${err.message}):</strong> Verificá el estado de la API Key en tu Dashboard de Groq.`;

                textoHtml.innerHTML = `<div class="bg-red-950/40 border border-red-500/30 rounded-lg p-4 text-red-300 text-sm leading-relaxed">
                    ${msgError}
                </div>`;
                container.classList.remove('hidden');
            } finally {
                btn.disabled = false;
            }
        }

        function limpiarPantalla() {
            document.getElementById('consulta-clinica').value = "";
            document.getElementById('resultado-container').classList.add('hidden');
            document.getElementById('status-motor').innerText = "Listo para buscar";
        }
    </script>
</body>
</html>
